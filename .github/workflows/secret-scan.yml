name: Secret scan

# Free replacement for GitHub secret scanning and push protection, which need paid
# Secret Protection on a private repository (lfmap #346). gitleaks is MIT licensed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (pinned by SHA-256)
        run: |
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSL --fail -o gitleaks.tar.gz "$url"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history
        run: ./gitleaks git --no-banner --redact --verbose .
